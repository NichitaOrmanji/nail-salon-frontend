# Обновления зависимостей: раз в неделю Dependabot открывает PR. Мелкие (minor/patch) — одним PR,
# крупные (major) — отдельными. Каждый PR проходит CI (lint, сборка) и браузерные тесты (E2E).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Chisinau
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Chisinau
    groups:
      actions:
        patterns: ['*']
