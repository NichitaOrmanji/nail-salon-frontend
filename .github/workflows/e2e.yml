# Браузерные тесты (e2e/): настоящий бэкенд (Postgres, салон e2e из e2e_seed) + сборка сайта
# с заголовками как на Vercel. Запускается на PR и push в main этого репозитория, а также из CI
# бэкенда (C001tea/online-registration-site) — так правка в любом репозитории проверяется целиком.
name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      frontend_ref:
        description: Версия фронтенда (ветка или commit)
        type: string
        default: main
      backend_ref:
        description: Версия бэкенда (ветка или commit)
        type: string
        default: main

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: e2e-secret-key-e2e-secret-key-e2e-secret-key-e2e-secret-1234
      DATABASE_URL: postgres://e2e:e2e@localhost:5432/e2e
      E2E_PASSWORD: E2e-pass-2026!
    steps:
      - uses: actions/checkout@v4
        with:
          repository: NichitaOrmanji/nail-salon-frontend
          ref: ${{ inputs.frontend_ref || github.sha }}
          path: frontend
      - uses: actions/checkout@v4
        with:
          repository: C001tea/online-registration-site
          ref: ${{ inputs.backend_ref || 'main' }}
          path: backend

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Бэкенд с салоном e2e
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py migrate -v0
          python manage.py createcachetable
          python manage.py e2e_seed --password "$E2E_PASSWORD"
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health/ && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/backend.log"; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Сборка сайта для салона e2e
        working-directory: frontend
        run: |
          npm ci
          VITE_DEFAULT_SALON=e2e npm run build
          npx playwright install --with-deps chromium
      - name: Тесты
        working-directory: frontend
        run: npx playwright test

      - name: Отчёт при ошибке
        if: failure()
        run: cp "$RUNNER_TEMP/backend.log" frontend/test-results/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
